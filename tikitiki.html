<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#061326">
    <meta name="description" content="Un pequeño detalle hecho con mucho cariño. 💙">
    <title>💙</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            height: 100vh;
            height: 100svh;
            background: #061326;
            font-family: 'Segoe UI', sans-serif;
            color: white;
        }

        .scene {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            isolation: isolate;
            background:
                radial-gradient(ellipse at 50% 45%, rgba(23, 87, 143, .38), transparent 42%),
                radial-gradient(ellipse at 15% 20%, rgba(24, 100, 160, .18), transparent 38%),
                radial-gradient(ellipse at 85% 80%, rgba(24, 69, 137, .2), transparent 40%),
                linear-gradient(145deg, #07182d, #030a17 75%);
        }

        /* nebulosas */

        .nebula {
            position: absolute;
            width: 65vw;
            height: 65vw;
            max-width: 700px;
            max-height: 700px;
            border-radius: 50%;
            filter: blur(75px);
            opacity: .18;
            pointer-events: none;
            animation: nebulaFloat 13s ease-in-out infinite alternate;
        }

        .nebula.one {
            background: #087ed2;
            top: -25%;
            left: -20%;
        }

        .nebula.two {
            background: #3158d9;
            bottom: -35%;
            right: -20%;
            animation-delay: -6s;
        }

        .nebula.three {
            background: #00b8d9;
            width: 35vw;
            height: 35vw;
            top: 30%;
            right: -15%;
            opacity: .1;
            animation-delay: -3s;
        }

        @keyframes nebulaFloat {
            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(45px, -35px) scale(1.2);
            }
        }

        /* luz detrás del corazón */

        .aura {
            position: absolute;
            width: min(75vw, 650px);
            aspect-ratio: 1;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(40, 155, 235, .2), transparent 68%);
            filter: blur(20px);
            animation: auraPulse 4s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes auraPulse {
            0%, 100% {
                transform: scale(.9);
                opacity: .5;
            }

            50% {
                transform: scale(1.13);
                opacity: 1;
            }
        }

        /* corazón */

        #heart {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: grab;
            z-index: 2;
        }

        #heart:active {
            cursor: grabbing;
        }

        /* mensaje */

        .message {
            position: absolute;
            z-index: 3;
            bottom: max(8%, 45px);
            left: 0;
            width: 100%;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            animation: messageAppear 2s ease forwards;
            animation-delay: 2s;
        }

        .message h1 {
            font-size: clamp(30px, 6vw, 43px);
            font-weight: 500;
            letter-spacing: 3px;
            color: #e0f6ff;
            text-shadow:
                0 0 12px rgba(80, 190, 255, .6),
                0 0 35px rgba(45, 155, 255, .35);
        }

        .message p {
            margin-top: 9px;
            font-size: clamp(13px, 3.5vw, 15px);
            color: rgba(194, 222, 246, .75);
            letter-spacing: 1.5px;
        }

        @keyframes messageAppear {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* indicación */

        .hint {
            position: absolute;
            z-index: 3;
            bottom: 19px;
            width: 100%;
            text-align: center;
            color: rgba(174, 214, 245, .42);
            font-size: 10px;
            letter-spacing: 2px;
            pointer-events: none;
        }

        /* botón de música */

        .music-player {
            position: absolute;
            z-index: 5;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
        }

        .music-player button {
            display: inline-block;
            padding: 10px 18px;
            border: 1px solid rgba(120, 205, 255, .35);
            border-radius: 30px;
            background: rgba(8, 35, 65, .65);
            color: #c9edff;
            font-size: 12px;
            letter-spacing: 1px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 0 18px rgba(40, 160, 255, .12);
            transition: .3s ease;
            white-space: nowrap;
        }

        .music-player button:hover {
            background: rgba(20, 75, 120, .8);
            border-color: rgba(120, 205, 255, .7);
            box-shadow: 0 0 22px rgba(40, 160, 255, .25);
            transform: translateY(-2px);
        }

        .music-player button:focus-visible {
            outline: 2px solid #a8e5ff;
            outline-offset: 4px;
        }

        /* reproductor invisible */

        .music-player iframe {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            border: 0;
        }

        /* celulares */

        @media (max-width: 600px) {
            .message {
                bottom: 12%;
            }

            .message h1 {
                letter-spacing: 2px;
            }

            .hint {
                bottom: 17px;
            }

            .nebula {
                filter: blur(55px);
            }

            .music-player {
                top: 20px;
            }

            .music-player button {
                padding: 9px 15px;
                font-size: 11px;
            }
        }

        @media (max-height: 650px) {
            .message {
                bottom: 5%;
            }

            .message h1 {
                font-size: 28px;
            }

            .message p {
                margin-top: 4px;
            }

            .hint {
                bottom: 7px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .nebula,
            .aura,
            .message {
                animation: none;
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <main class="scene">

        <div class="nebula one"></div>
        <div class="nebula two"></div>
        <div class="nebula three"></div>
        <div class="aura"></div>

        <canvas id="heart" aria-label="Corazón azul interactivo en 3D"></canvas>

        <div class="message">
            <h1>te amo</h1>
            <p>besito besito &lt;3</p>
        </div>

        <div class="hint">toca y mueve el corazoncito ✦</div>

        <!-- música -->

        <div class="music-player">

            <button id="musicButton" type="button">
                ♫ escuchar nuestra canción
            </button>

            <iframe
                id="youtubeMusic"
                src="about:blank"
                title="Nuestra canción"
                allow="autoplay; encrypted-media"
                referrerpolicy="strict-origin-when-cross-origin">
            </iframe>

        </div>

    </main>

    <script>

        /* configuración del lienzo */

        const canvas = document.getElementById("heart");
        const ctx = canvas.getContext("2d");

        let width = 0;
        let height = 0;
        let dpr = 1;

        function resize() {
            dpr = Math.min(window.devicePixelRatio || 1, 1.7);

            width = canvas.clientWidth;
            height = canvas.clientHeight;

            canvas.width = Math.round(width * dpr);
            canvas.height = Math.round(height * dpr);

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        window.addEventListener("resize", resize);
        resize();


        /* configuración de partículas */

        const PARTICLE_COUNT = width < 600 ? 1800 : 2800;

        const particles = [];
        const stars = [];
        const bursts = [];

        let rotationY = 0;
        let rotationX = 0.08;

        let targetRotationY = 0;
        let targetRotationX = 0.08;

        let dragging = false;
        let previousX = 0;
        let previousY = 0;

        let time = 0;
        let pulse = 0;


        /* forma del corazón */

        function heartOutline(angle) {
            const x = 16 * Math.pow(Math.sin(angle), 3);

            const y =
                13 * Math.cos(angle)
                - 5 * Math.cos(2 * angle)
                - 2 * Math.cos(3 * angle)
                - Math.cos(4 * angle);

            return {
                x: x / 17,
                y: (y + 2.5) / 17
            };
        }


        /* crear partículas */

        function createParticle() {
            const angle = Math.random() * Math.PI * 2;
            const isEdge = Math.random() < 0.36;

            const radius = isEdge
                ? 0.94 + Math.random() * 0.06
                : Math.sqrt(Math.random()) * 0.93;

            const outline = heartOutline(angle);

            const x = outline.x * radius;
            const y = outline.y * radius;

            const depth = Math.sqrt(Math.max(0, 1 - radius * radius));
            const z = (Math.random() - 0.5) * 0.65 * depth;

            return {
                x,
                y,
                z,
                size: Math.random() * 1.5 + 0.65,
                alpha: Math.random() * 0.45 + 0.55,
                phase: Math.random() * Math.PI * 2,
                color: Math.random()
            };
        }

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            particles.push(createParticle());
        }


        /* estrellas del fondo */

        function createStar() {
            return {
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 1.5 + 0.3,
                alpha: Math.random() * 0.65 + 0.15,
                speed: Math.random() * 0.35 + 0.08,
                phase: Math.random() * Math.PI * 2
            };
        }

        function initializeStars() {
            stars.length = 0;

            const count = Math.min(
                Math.floor((width * height) / 3000),
                280
            );

            for (let i = 0; i < count; i++) {
                stars.push(createStar());
            }
        }

        initializeStars();
        window.addEventListener("resize", initializeStars);


        /* proyección 3d */

        function project(p, scale, heartScale, floating) {
            const x = p.x * heartScale;
            const y = p.y * heartScale;
            const z = p.z * heartScale;

            const cosY = Math.cos(rotationY);
            const sinY = Math.sin(rotationY);

            const rx = x * cosY - z * sinY;
            const rz = x * sinY + z * cosY;

            const cosX = Math.cos(rotationX);
            const sinX = Math.sin(rotationX);

            const ry = y * cosX - rz * sinX;
            const rz2 = y * sinX + rz * cosX;

            const perspective = 4.5 / (4.5 + rz2);

            return {
                x: width / 2 + rx * scale * perspective,
                y: height * 0.43 + floating - ry * scale * perspective,
                z: rz2,
                perspective
            };
        }


        /* dibujar estrellas */

        function drawStars() {
            for (const star of stars) {
                star.y -= star.speed;

                if (star.y < -5) {
                    star.y = height + 5;
                    star.x = Math.random() * width;
                }

                const flicker =
                    0.55 + Math.sin(time * 1.5 + star.phase) * 0.35;

                ctx.beginPath();
                ctx.fillStyle =
                    `rgba(175,220,255,${star.alpha * flicker})`;

                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }


        /* destellos al tocar */

        function createBurst(x, y) {
            bursts.push({
                x,
                y,
                age: 0,
                maxAge: 55,
                angle: Math.random() * Math.PI * 2
            });

            pulse = 1;
        }

        function drawBursts() {
            for (let i = bursts.length - 1; i >= 0; i--) {
                const b = bursts[i];

                b.age++;

                const progress = b.age / b.maxAge;
                const radius = progress * 100;
                const alpha = (1 - progress) * 0.7;

                ctx.beginPath();
                ctx.strokeStyle = `rgba(100,210,255,${alpha})`;
                ctx.lineWidth = 1.5;
                ctx.arc(b.x, b.y, radius, 0, Math.PI * 2);
                ctx.stroke();

                for (let j = 0; j < 9; j++) {
                    const angle = b.angle + j * Math.PI * 2 / 9;

                    const distance =
                        radius + Math.sin(time * 3 + j) * 4;

                    const px = b.x + Math.cos(angle) * distance;
                    const py = b.y + Math.sin(angle) * distance;

                    ctx.beginPath();
                    ctx.fillStyle = `rgba(160,235,255,${alpha})`;
                    ctx.arc(px, py, 2, 0, Math.PI * 2);
                    ctx.fill();
                }

                if (b.age >= b.maxAge) {
                    bursts.splice(i, 1);
                }
            }
        }


        /* animación del corazón */

        function ease(a, b, speed) {
            return a + (b - a) * speed;
        }

        function draw() {
            requestAnimationFrame(draw);

            time += 0.016;

            ctx.clearRect(0, 0, width, height);

            /* rotación automática */

            if (!dragging) {
                targetRotationY += 0.003;

                targetRotationX =
                    0.08 + Math.sin(time * 0.45) * 0.10;
            }

            rotationY = ease(rotationY, targetRotationY, 0.045);
            rotationX = ease(rotationX, targetRotationX, 0.045);

            pulse = ease(pulse, 0, 0.045);

            drawStars();

            /* latido del corazón */

            const heartbeat = Math.sin(time * 2.2);

            const strongBeat = Math.pow(
                Math.max(0, Math.sin(time * 2.2)),
                8
            );

            const heartScale =
                1
                + heartbeat * 0.025
                + strongBeat * 0.075
                + pulse * 0.12;

            /* movimiento vertical */

            const floating = Math.sin(time * 1.3) * 9;
            const scale = Math.min(width, height) * 0.34;

            const projected = [];

            for (const p of particles) {
                const point = project(p, scale, heartScale, floating);

                const glow =
                    (Math.sin(time * 2.5 + p.phase) + 1) / 2;

                projected.push({
                    ...point,
                    size: p.size * point.perspective,
                    alpha: p.alpha,
                    glow,
                    color: p.color
                });
            }

            /* ordenar por profundidad */

            projected.sort((a, b) => b.z - a.z);

            /* dibujar partículas */

            for (const p of projected) {
                const alpha = p.alpha * (0.58 + p.glow * 0.42);

                if (p.color > 0.88) {
                    ctx.fillStyle = `rgba(225,250,255,${alpha})`;
                } else if (p.color > 0.48) {
                    ctx.fillStyle = `rgba(75,190,255,${alpha})`;
                } else {
                    ctx.fillStyle = `rgba(20,125,225,${alpha})`;
                }

                ctx.beginPath();
                ctx.arc(
                    p.x,
                    p.y,
                    Math.max(0.35, p.size),
                    0,
                    Math.PI * 2
                );
                ctx.fill();

                /* brillos pequeños */

                if (p.glow > 0.96 && p.size > 1) {
                    ctx.beginPath();
                    ctx.fillStyle =
                        `rgba(190,240,255,${alpha * 0.28})`;

                    ctx.arc(p.x, p.y, p.size * 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            drawBursts();
        }


        /* interacción con mouse y pantalla táctil */

        canvas.addEventListener("pointerdown", (e) => {
            dragging = true;

            previousX = e.clientX;
            previousY = e.clientY;

            canvas.setPointerCapture(e.pointerId);

            createBurst(e.clientX, e.clientY);
        });

        canvas.addEventListener("pointermove", (e) => {
            if (!dragging) return;

            const dx = e.clientX - previousX;
            const dy = e.clientY - previousY;

            targetRotationY += dx * 0.008;
            targetRotationX += dy * 0.008;

            targetRotationX = Math.max(
                -1.2,
                Math.min(1.2, targetRotationX)
            );

            previousX = e.clientX;
            previousY = e.clientY;
        });

        function stopDragging() {
            dragging = false;
        }

        canvas.addEventListener("pointerup", stopDragging);
        canvas.addEventListener("pointercancel", stopDragging);
        canvas.addEventListener("lostpointercapture", stopDragging);


        /* reproductor de música */

        const musicButton = document.getElementById("musicButton");
        const youtubeMusic = document.getElementById("youtubeMusic");

        const YOUTUBE_VIDEO_ID = "nJwq6oyim1Q";

        let musicPlaying = false;

        musicButton.addEventListener("click", () => {

            if (!musicPlaying) {
                youtubeMusic.src =
                    `https://www.youtube.com/embed/${YOUTUBE_VIDEO_ID}?autoplay=1&playsinline=1&rel=0`;

                musicButton.textContent = "♫ detener canción";
                musicPlaying = true;

            } else {
                youtubeMusic.src = "about:blank";

                musicButton.textContent = "♫ escuchar nuestra canción";
                musicPlaying = false;
            }

        });


        /* iniciar animación */

        draw();

    </script>

</body>

</html>
